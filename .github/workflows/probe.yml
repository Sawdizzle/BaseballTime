name: probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Resend domain verification
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          id=$(curl -s -H "Authorization: Bearer $RESEND_API_KEY" https://api.resend.com/domains \
               | python3 -c "import sys,json;d=json.load(sys.stdin);print((d.get('data') or [{}])[0].get('id',''))")
          echo "PROBE domain_id=${id:0:8}..."
          echo "PROBE verify_response=$(curl -s -X POST -H "Authorization: Bearer $RESEND_API_KEY" https://api.resend.com/domains/$id/verify)"
          sleep 20
          curl -s -H "Authorization: Bearer $RESEND_API_KEY" https://api.resend.com/domains/$id > /tmp/one.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/one.json"))
          print("PROBE status:", d.get("status"))
          for r in d.get("records", []) or []:
              print("PROBE record:", r.get("record"), r.get("name"), "->", r.get("status"))
          PY
